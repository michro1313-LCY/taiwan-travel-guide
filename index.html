<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Michael 的台灣旅遊攻略">
  <title>Michael 的台灣旅遊攻略</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">TAIWAN TRAVEL GUIDE</p>
      <h1>Michael 的台灣旅遊攻略</h1>
      <p>大眾運輸、鐵道、完整路線與實用的一日遊提案</p>
    </div>
    <button id="loginButton" class="secondary">管理員登入</button>
    <button id="logoutButton" class="secondary" hidden>登出</button>
  </header>

  <main>
    <section id="status" class="status" aria-live="polite"></section>

    <section id="adminPanel" class="panel" hidden>
      <div class="section-heading">
        <div>
          <p class="eyebrow">ADMIN</p>
          <h2>內容管理</h2>
        </div>
        <span id="adminIdentity"></span>
      </div>

      <form id="postForm">
        <input id="postId" type="hidden">
        <label>文章標題<input id="title" maxlength="100" required></label>
        <label>摘要<textarea id="excerpt" maxlength="240" required></textarea></label>
        <label>文章內容<textarea id="body" rows="8" maxlength="12000" required></textarea></label>
        <label>封面圖片
          <input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp">
        </label>
        <label>或使用圖片網址<input id="imageUrl" type="url" placeholder="https://..."></label>
        <label class="check"><input id="published" type="checkbox" checked> 立即公開</label>
        <div class="actions">
          <button type="submit">儲存文章</button>
          <button id="cancelEdit" type="button" class="secondary">取消編輯</button>
        </div>
      </form>

      <div class="section-heading queue-heading">
        <h2>待審核留言</h2>
        <button id="refreshComments" class="secondary" type="button">重新整理</button>
      </div>
      <div id="commentQueue" class="comment-list"></div>
    </section>

    <section>
      <div class="section-heading">
        <div>
          <p class="eyebrow">LATEST GUIDES</p>
          <h2>最新旅遊攻略</h2>
        </div>
        <button id="showFavorites" class="secondary" type="button">只看收藏</button>
      </div>
      <div id="posts" class="post-grid"></div>
    </section>
  </main>

  <dialog id="loginDialog">
    <form id="loginForm" method="dialog">
      <h2>管理員登入</h2>
      <p>僅限網站管理員使用。</p>
      <label>電子郵件<input id="email" type="email" autocomplete="username" required></label>
      <label>密碼<input id="password" type="password" autocomplete="current-password" required></label>
      <div class="actions">
        <button type="submit">登入</button>
        <button id="closeLogin" type="button" class="secondary">取消</button>
      </div>
    </form>
  </dialog>

  <dialog id="commentDialog">
    <form id="commentForm" method="dialog">
      <h2>提供留言或補充資料</h2>
      <input id="commentPostId" type="hidden">
      <label>稱呼<input id="commentName" maxlength="40" required></label>
      <label>留言內容<textarea id="commentText" rows="5" maxlength="1000" required></textarea></label>
      <p class="fine-print">留言送出後會先進入審核，不會立即公開。請勿填寫電話、地址等個人資料。</p>
      <div class="actions">
        <button type="submit">送出</button>
        <button id="closeComment" type="button" class="secondary">取消</button>
      </div>
    </form>
  </dialog>

  <template id="postTemplate">
    <article class="post-card">
      <img class="post-image" alt="" loading="lazy">
      <div class="post-content">
        <h3></h3>
        <p class="excerpt"></p>
        <div class="post-body"></div>
        <div class="actions">
          <button class="favorite secondary" type="button"></button>
          <button class="comment secondary" type="button">留言／補充</button>
          <button class="edit" type="button" hidden>編輯</button>
          <button class="delete danger" type="button" hidden>刪除</button>
        </div>
      </div>
    </article>
  </template>

  <script src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
